<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>صيدلية ذكية - السودان</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; direction: rtl; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2, h3 { color: #2c3e50; text-align: center; }
        input, textarea, select, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .btn-success { background: #28a745; }
        .btn-success:hover { background: #218838; }
        .btn-danger { background: #dc3545; width: auto; padding: 6px 12px; }
        .hidden { display: none !important; }
        
        .phone-group { display: flex; gap: 8px; }
        .phone-group select { width: 130px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: #fff; border: 1px solid #e1e4e8; border-radius: 10px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        .price { color: #28a745; font-weight: bold; font-size: 16px; }

        .diagnose-box { background: #e8f4fd; border: 2px dashed #007bff; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .cart-section { background: #fff3cd; padding: 15px; border-radius: 8px; margin-top: 20px; }
        .error { color: red; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- قسم تسجيل الدخول / صيدلية ذكية -->
    <div id="authSection">
        <h2 id="authTitle">تسجيل الدخول إلى صيدلية ذكية</h2>
        <form id="authForm">
            <div id="registerFields" class="hidden">
                <input type="text" id="fullname" placeholder="الاسم الكامل">
                <div class="phone-group">
                    <select id="countryCode">
                        <option value="+249" selected>السودان (+249)</option>
                        <option value="+20">مصر (+20)</option>
                        <option value="+966">السعودية (+966)</option>
                    </select>
                    <input type="tel" id="phone" placeholder="رقم الهاتف (مثلاً: 912345678)">
                </div>
            </div>

            <input type="email" id="authEmail" placeholder="البريد الإلكتروني" required>
            <input type="password" id="authPassword" placeholder="كلمة المرور" required>
            <button type="submit" id="authBtn">تسجيل الدخول</button>
            <button type="button" class="btn-success" onclick="toggleAuthMode()" id="switchBtn">صيدلية ذكية (حساب جديد)</button>
            <p id="authError" class="error"></p>
        </form>
    </div>

    <!-- لوحة المتجر الرئيسية -->
    <div id="shopSection" class="hidden">
        <div class="header-bar">
            <span id="userDisplay" style="font-weight: bold; color: #555;"></span>
            <button class="btn-danger" onclick="logout()">تسجيل خروج</button>
        </div>

        <h2>متجر صيدلية ذكية</h2>

        <!-- صندوق التشخيص الذكي -->
        <div class="diagnose-box">
            <h3 style="margin-top:0; color:#0056b3;">🤖 صندوق التشخيص الذكي</h3>
            <p style="font-size: 13px; color: #555;">اكتب ما تشعر به (مثل: صداع، حمى، مغص):</p>
            <textarea id="userSymptoms" rows="2" placeholder="اكتب أعراضك هنا..."></textarea>
            <button onclick="diagnoseSymptoms()" class="btn-success">تشخيص واقتراح الدواء المناسب</button>
            <div id="diagnoseResult" style="margin-top: 10px; font-weight: bold; color: #d9534f;"></div>
        </div>

        <!-- لوحة التحكم لإضافة الأدوية (للأدمن) -->
        <div id="adminPanel" class="hidden" style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <h3 style="margin-top:0;">إدارة الأدوية (خاص بالأدمن)</h3>
            <form id="addMedForm">
                <input type="text" id="medName" placeholder="اسم الدواء" required>
                <input type="number" step="0.01" id="medPrice" placeholder="السعر ($)" required>
                <input type="text" id="medSymptoms" placeholder="الأعراض التي يعالجها (مثلاً: صداع)" required>
                <input type="file" id="medImage" accept="image/*" required>
                <button type="submit" class="btn-success">إضافة الدواء للمتجر</button>
            </form>
        </div>

        <h3>قائمة الأدوية المتاحة</h3>
        <div id="medicinesGrid" class="grid"></div>

        <!-- سلة المشتريات -->
        <div class="cart-section">
            <h3 style="margin-top:0;">🛒 سلة المشتريات</h3>
            <div id="cartItems">السلة فارغة حالياً</div>
            <div id="cartTotal" style="font-weight: bold; margin: 10px 0;">الإجمالي: $0.00</div>
            <button onclick="checkout()" class="btn-success">إتمام الشراء الآن</button>
        </div>
    </div>

</div>

<script>
    let isRegisterMode = false;
    let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;
    let cart = [];
    let allMedicines = [];

    if (currentUser) {
        showShop();
    }

    function toggleAuthMode() {
        isRegisterMode = !isRegisterMode;
        document.getElementById('registerFields').classList.toggle('hidden', !isRegisterMode);
        document.getElementById('authTitle').innerText = isRegisterMode ? 'صيدلية ذكية - تسجيل حساب جديد' : 'تسجيل الدخول إلى صيدلية ذكية';
        document.getElementById('authBtn').innerText = isRegisterMode ? 'تسجيل وحفظ الحساب' : 'تسجيل الدخول';
        document.getElementById('switchBtn').innerText = isRegisterMode ? 'لديك حساب؟ تسجيل الدخول' : 'صيدلية ذكية (حساب جديد)';
        document.getElementById('authError').innerText = '';
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        
        let bodyData = { email, password };
        let endpoint = '/api/login';

        if (isRegisterMode) {
            endpoint = '/api/register';
            bodyData.fullname = document.getElementById('fullname').value;
            bodyData.phone = document.getElementById('phone').value;
            bodyData.country_code = document.getElementById('countryCode').value;
        }

        const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bodyData)
        });
        const data = await res.json();

        if (data.success) {
            currentUser = data.user;
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            showShop();
        } else {
            document.getElementById('authError').innerText = data.message || 'حدث خطأ ما';
        }
    });

    function showShop() {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('shopSection').classList.remove('hidden');
        document.getElementById('userDisplay').innerText = `مرحباً بك: ${currentUser.fullname || currentUser.email} (${currentUser.role === 'admin' ? 'مدير' : 'زبون'})`;
        
        if (currentUser.role === 'admin') {
            document.getElementById('adminPanel').classList.remove('hidden');
        }
        loadMedicines();
    }

    function logout() {
        localStorage.removeItem('currentUser');
        currentUser = null;
        document.getElementById('shopSection').classList.add('hidden');
        document.getElementById('authSection').classList.remove('hidden');
    }

    function getBaseImage(file) {
        return new Promise((resolve) => {
            if (!file) return resolve('');
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.readAsDataURL(file);
        });
    }

    document.getElementById('addMedForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fileInput = document.getElementById('medImage');
        const imageBase64 = await getBaseImage(fileInput.files[0]);

        await fetch('/api/medicines', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: document.getElementById('medName').value,
                price: document.getElementById('medPrice').value,
                symptoms: document.getElementById('medSymptoms').value,
                image: imageBase64
            })
        });

        document.getElementById('addMedForm').reset();
        loadMedicines();
    });

    async function loadMedicines() {
        const res = await fetch('/api/medicines');
        allMedicines = await res.json();
        const grid = document.getElementById('medicinesGrid');
        
        if (allMedicines.length === 0) {
            grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">لا توجد أدوية معروضة حالياً.</p>';
            return;
        }

        grid.innerHTML = allMedicines.map(m => `
            <div class="card">
                <img src="${m.image || 'https://via.placeholder.com/100'}" alt="${m.name}">
                <h4>${m.name}</h4>
                <p class="price">$${m.price}</p>
                <p style="font-size:12px; color:#666;">يعالج: ${m.symptoms}</p>
                <button onclick="addToCart(${m.id})" class="btn-success">إضافة إلى السلة</button>
            </div>
        `).join('');
    }

    function addToCart(id) {
        const med = allMedicines.find(m => m.id === id);
        const item = cart.find(i => i.id === id);
        if (item) {
            item.qty++;
        } else {
            cart.push({ ...med, qty: 1 });
        }
        updateCartUI();
    }

    function updateCartUI() {
        const container = document.getElementById('cartItems');
        const totalEl = document.getElementById('cartTotal');
        if (cart.length === 0) {
            container.innerHTML = 'السلة فارغة حالياً';
            totalEl.innerHTML = 'الإجمالي: $0.00';
            return;
        }

        let total = 0;
        container.innerHTML = cart.map(i => {
            total += i.price * i.qty;
            return `<div style="display:flex; justify-content:space-between; margin:5px 0;"><span>${i.name} (${i.qty})</span> <span>$${i.price * i.qty}</span></div>`;
        }).join('');
        totalEl.innerHTML = `الإجمالي: $${total.toFixed(2)}`;
    }

    function diagnoseSymptoms() {
        const query = document.getElementById('userSymptoms').value.trim().toLowerCase();
        const resultBox = document.getElementById('diagnoseResult');
        if (!query) {
            resultBox.innerText = 'الرجاء كتابة الأعراض التي تعاني منها أولاً.';
            return;
        }

        const found = allMedicines.filter(m => m.symptoms.toLowerCase().includes(query) || query.includes(m.symptoms.toLowerCase()));
        if (found.length > 0) {
            resultBox.innerHTML = `الدواء المقترح لحالتك: <span style="color:#28a745;">${found.map(f => f.name).join(', ')}</span> (متاح في المتجر أدناه)`;
        } else {
            resultBox.innerText = 'عذراً، لم نجد دواء مطابق تماماً للأعراض المدخلة. يرجى استشارة الصيدلي.';
        }
    }

    async function checkout() {
        if (cart.length === 0) {
            alert('السلة فارغة!');
            return;
        }
        const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

        const res = await fetch('/api/checkout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: currentUser.email, items: cart, total })
        });
        const data = await res.json();
        
        if (data.success) {
            alert('تم إرسال طلبك بنجاح! شكراً لتسوقك.');
            cart = [];
            updateCartUI();
        }
    }
</script>

</body>
</html>
